name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Fetch Whisper model
        shell: bash
        run: |
          mkdir -p assets/whisper
          curl -sL -o assets/whisper/ggml-small.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin"
          ls -la assets/whisper
      - name: Build whisper.cpp (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 --branch v1.8.2 https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/whisper.cpp/build -j 4 --target whisper-cli
          cp /tmp/whisper.cpp/build/bin/whisper-cli assets/whisper/whisper-cli
          chmod +x assets/whisper/whisper-cli
      - name: Build whisper.cpp (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.8.2 https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/whisper.cpp/build -j 4 --config Release --target whisper-cli
          cp /tmp/whisper.cpp/build/bin/Release/whisper-cli.exe assets/whisper/whisper-cli.exe
          cp /tmp/whisper.cpp/build/bin/Release/*.dll assets/whisper/ || true
          ls -la assets/whisper
      - name: Build installer
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
